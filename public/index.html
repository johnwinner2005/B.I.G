<style id="app-css">/* Layout concept: dark cinematic hero over a quiet paper-grey catalogue; sales = light panels, rentals = ink panels; bottom-anchored thumb actions on phones. */
:root{
  --f-display:'Bricolage Grotesque','Helvetica Neue',Arial,sans-serif;
  --f-body:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
  --accent-base:#CE3837; --brand:#CE3837;
  --bg:#ECEDF0; --surface:#F8F8FA; --surface2:#E1E3E8; --ink:#0B0C10; --mute:#586070; --line:#D2D5DC;
  --accent:var(--accent-base); --on-accent:#fff;
  --ok:#17794F; --warn:#9A6212; --bad:#B3342E;
  --hero:#07080B; --hero-ink:#F4F5F7; --hero-mute:#A3A9B6;
  --r:16px; --r-sm:10px; --ease:cubic-bezier(.2,.7,.2,1);
  --shadow:0 1px 2px rgba(10,12,20,.06),0 8px 28px -12px rgba(10,12,20,.18);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#090A0D; --surface:#13151A; --surface2:#1C1F26; --ink:#F2F3F6; --mute:#9BA2B0; --line:#262A33;
    --accent:color-mix(in srgb,var(--accent-base) 90%,#fff); --on-accent:#fff;
    --ok:#4CC38A; --warn:#E0A94A; --bad:#F0736C;
    --shadow:0 1px 0 rgba(255,255,255,.03) inset,0 14px 34px -16px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#090A0D; --surface:#13151A; --surface2:#1C1F26; --ink:#F2F3F6; --mute:#9BA2B0; --line:#262A33;
  --accent:color-mix(in srgb,var(--accent-base) 90%,#fff); --on-accent:#fff;
  --ok:#4CC38A; --warn:#E0A94A; --bad:#F0736C;
  --shadow:0 1px 0 rgba(255,255,255,.03) inset,0 14px 34px -16px rgba(0,0,0,.7);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;overflow-x:hidden;-webkit-font-smoothing:antialiased}
body.noscroll{overflow:hidden}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:700;line-height:1.02;letter-spacing:-.02em;margin:0;text-wrap:balance;font-variation-settings:'wdth' 86}
p{margin:0}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
img,video{display:block;max-width:100%}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}
.in{width:100%;max-width:1240px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.num{font-variant-numeric:tabular-nums}

/* progress road */
.road{position:fixed;left:0;right:0;top:0;height:3px;z-index:80;pointer-events:none}
.road i{position:absolute;left:0;top:0;height:100%;width:calc(var(--prog,0)*100%);background:var(--accent)}

/* header */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:70;background:var(--band,var(--hero))}
html.solid{--band:var(--bg)}
.top{position:fixed;inset:0 0 auto;z-index:60;padding-top:env(safe-area-inset-top,0px);color:var(--hero-ink);transition:background .3s,color .3s,box-shadow .3s}

.top .in{display:flex;align-items:center;justify-content:space-between;height:60px;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:800;font-size:1.25rem;letter-spacing:-.03em;font-variation-settings:'wdth' 80}

.ibtn svg{width:20px;height:20px}
.dot{position:absolute;top:-2px;right:-2px;min-width:18px;height:18px;border-radius:9px;background:var(--accent);color:var(--on-accent);font-size:.7rem;font-weight:700;display:grid;place-items:center;padding:0 4px}
.menu{position:fixed;inset:0;z-index:90;background:var(--hero);color:var(--hero-ink);padding:calc(env(safe-area-inset-top,0px) + 80px) max(24px,env(safe-area-inset-left,0px)) 40px;display:flex;flex-direction:column;gap:6px;transform:translateY(-100%);transition:transform .5s var(--ease);visibility:hidden}
.menu.open{transform:none;visibility:visible}
.menu a{font-family:var(--f-display);font-size:2.4rem;font-weight:700;letter-spacing:-.03em;padding:6px 0;font-variation-settings:'wdth' 82;display:flex;justify-content:space-between;align-items:baseline}

.menu .x{position:absolute;top:calc(env(safe-area-inset-top,0px) + 9px);right:max(16px,env(safe-area-inset-right,0px))}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:50px;padding:0 24px;border-radius:999px;font-weight:700;font-size:1rem;background:var(--accent);color:var(--on-accent);transition:transform .2s,filter .2s;white-space:nowrap}

.btn.block{width:100%}

.btn svg{width:20px;height:20px;flex:none}
.btn.danger{background:var(--bad);color:#fff}

/* hero */
.hero{position:relative;background:var(--hero);color:var(--hero-ink);overflow:hidden;padding-top:calc(env(safe-area-inset-top,0px) + 96px)}
.hero-bg{position:absolute;inset:-6% 0 0;background:radial-gradient(120% 70% at 70% 100%,#20263a 0%,transparent 60%),radial-gradient(80% 50% at 10% 0%,#161a26 0%,transparent 70%)}
.hero-bg img,.hero-bg video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.78}
.hero-bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(7,8,11,.55),rgba(7,8,11,.1) 40%,rgba(7,8,11,.92))}
.hero .in{position:relative;z-index:2}
.hero h1{font-size:clamp(3rem,14.5vw,8.4rem);font-weight:800;letter-spacing:-.045em;line-height:.9;font-variation-settings:'wdth' 75}
.hero h1 .w{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.08em}
.hero h1 .w span{display:inline-block;animation:rise .9s var(--ease) both;animation-delay:calc(var(--i)*70ms + 100ms)}
@keyframes rise{from{transform:translateY(105%)}to{transform:none}}
.hero p.sub{max-width:34ch;margin-top:22px;color:var(--hero-mute);font-size:1.08rem}
.hero .ctas{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px}
.hero .ctas .btn.ghost{color:var(--hero-ink)}
.hero-bg img.hero-scene{inset:auto 0 0 -26%;width:152%;height:auto;max-width:none;object-fit:initial;opacity:1;-webkit-mask-image:linear-gradient(180deg,transparent 0,#000 38%);mask-image:linear-gradient(180deg,transparent 0,#000 38%)}
.hsp{height:calc(124vw - 20px)}
.hero-photos{position:absolute;z-index:1;left:16px;right:16px;bottom:76px;aspect-ratio:4/5;border-radius:22px;overflow:hidden;background:#10131a;box-shadow:0 30px 80px -20px rgba(0,0,0,.8),0 0 0 1px rgba(255,255,255,.08)}
.hero-photos::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,rgba(7,8,11,.45));pointer-events:none}
.hero-photos img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;animation:hshot 25s infinite;animation-delay:calc(var(--i)*5s)}
.hero-photos img:first-child{opacity:1}
@keyframes hshot{0%{opacity:0;transform:scale(1.06)}5%{opacity:1}20%{opacity:1}25%{opacity:0;transform:scale(1)}100%{opacity:0;transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.hero-photos img{animation:none}.hero-photos img:not(:first-child){display:none}}
@media (min-width:820px){.hsp{height:330px}.hero-photos{left:auto;right:max(36px,calc((100vw - 1240px)/2 + 36px));top:50%;bottom:auto;width:min(34vw,440px);transform:translateY(-50%)}.hero h1{font-size:clamp(3.6rem,6.2vw,6.2rem);max-width:7.6em}.hero p.sub{max-width:34ch}}
@media (min-width:820px){.hero-bg img.hero-scene{inset:auto 0 0 0;width:100%;left:0}}
.hero-car{position:relative;z-index:1;margin:10px auto 0;max-width:1100px;will-change:transform}
.hero-car img{width:100%;height:auto;filter:drop-shadow(0 40px 40px rgba(0,0,0,.5))}
.hero-foot{position:relative;z-index:2;border-top:1px solid rgba(255,255,255,.1);padding-block:16px;color:var(--hero-mute);font-size:.9rem}
.hero-foot .in{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.hero-foot b{color:var(--hero-ink);font-weight:600}

/* marquee */
.band{background:var(--accent);color:var(--on-accent);overflow:hidden;padding-block:14px;white-space:nowrap}
.band div{display:inline-block;will-change:transform;font-family:var(--f-display);font-weight:800;font-size:clamp(1.6rem,6vw,3rem);letter-spacing:-.03em;font-variation-settings:'wdth' 78;text-transform:none}
.band span{margin-right:28px}.band span::after{content:"✦";margin-left:28px;opacity:.55;font-size:.6em;vertical-align:.25em}

/* sections */
.sec{padding-block:clamp(48px,9vw,110px)}
.sec.tight{padding-block:clamp(32px,6vw,64px)}
.sh{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:26px;flex-wrap:wrap}
.sh h2{font-size:clamp(2rem,7vw,4rem);max-width:14ch}
.sh p{color:var(--mute);max-width:44ch}
.lnk{font-weight:700;display:inline-flex;gap:8px;align-items:center;border-bottom:2px solid var(--accent);padding-bottom:2px}

/* pathways */
.paths{display:grid;gap:14px}
.path{position:relative;border-radius:24px;overflow:hidden;min-height:380px;display:flex;flex-direction:column;justify-content:flex-end;padding:24px;isolation:isolate}
.path.s{background:var(--surface);box-shadow:var(--shadow)}
.path.r{background:var(--hero);color:var(--hero-ink)}
.path img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-1;transition:transform 1.2s var(--ease)}
.path:hover img{transform:scale(1.04)}
.path.s::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,transparent 30%,color-mix(in srgb,var(--surface) 92%,transparent))}
.path.r::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,transparent 20%,rgba(7,8,11,.9))}
.path .k{font-weight:600;font-size:.9rem;opacity:.75}
.path h3{font-size:clamp(2.2rem,8vw,3.6rem);margin:6px 0 10px}
.path p{max-width:36ch;opacity:.85;margin-bottom:18px}
@media (min-width:820px){.paths{grid-template-columns:1fr 1fr}.path{min-height:520px}}

/* cards + rails */
.rail{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px max(16px,env(safe-area-inset-left,0px)) 24px;margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rail .card{flex:0 0 min(78vw,330px);scroll-snap-align:center}
.grid{display:grid;gap:16px;grid-template-columns:1fr}
@media (min-width:620px){.grid{grid-template-columns:1fr 1fr}}
@media (min-width:980px){.grid{grid-template-columns:repeat(3,1fr);gap:22px}}
.card{position:relative;background:var(--surface);border-radius:20px;overflow:hidden;box-shadow:var(--shadow);transition:transform .35s var(--ease)}
.card:hover{transform:translateY(-4px)}
.card-img{display:block;aspect-ratio:4/3;overflow:hidden;background:var(--surface2);position:relative}
.card-img img{width:100%;height:100%;object-fit:cover;transform:scale(1.14) translateX(var(--sx,0px));transition:transform .6s var(--ease)}
.card:hover .card-img img{transform:scale(1.2) translateX(var(--sx,0px))}
.card-b{padding:16px 18px 20px;display:grid;gap:6px}
.card-t{font-family:var(--f-display);font-weight:700;font-size:1.28rem;letter-spacing:-.02em;line-height:1.1}
.card-s{color:var(--mute);font-size:.9rem}
.card-p{font-family:var(--f-display);font-weight:700;font-size:1.35rem;margin-top:6px;font-variant-numeric:tabular-nums}
.card-p small{font-family:var(--f-body);font-weight:500;color:var(--mute);font-size:.85rem}
.tag{position:absolute;left:12px;top:12px;padding:5px 11px;border-radius:999px;background:rgba(8,9,12,.78);color:#fff;font-size:.78rem;font-weight:700;backdrop-filter:blur(6px);z-index:2}

.heart{position:absolute;right:10px;top:10px;width:40px;height:40px;border-radius:50%;background:rgba(8,9,12,.62);color:#fff;display:grid;place-items:center;z-index:3;backdrop-filter:blur(6px);transition:transform .2s}

.heart.on{background:var(--accent);color:var(--on-accent)}

.heart:active{transform:scale(.85)}

/* filters */
.fbar{display:grid;gap:10px;margin-bottom:22px}
.fbar .row{display:flex;gap:8px;flex-wrap:wrap}

.field:focus,.sel:focus{outline:none;border-color:var(--accent)}
textarea.field{padding:12px 16px;min-height:110px;resize:vertical;line-height:1.5}
.fbar .grow{flex:1 1 220px}.fbar .sel{flex:1 1 140px;width:auto}
.more{background:var(--surface);border-radius:14px;padding:14px;display:grid;gap:10px;grid-template-columns:1fr 1fr}
.more label{display:grid;gap:4px;font-size:.8rem;color:var(--mute);font-weight:600}
.count{color:var(--mute);margin-bottom:14px;font-size:.95rem}
.empty{text-align:center;padding:60px 20px;color:var(--mute);background:var(--surface);border-radius:20px;display:grid;gap:14px;justify-items:center}
.empty h3{color:var(--ink);font-size:1.6rem}

/* page head */
.ph{padding-top:calc(env(safe-area-inset-top,0px) + 100px);padding-bottom:28px}
.ph h1{font-size:clamp(2.6rem,11vw,6rem);letter-spacing:-.04em;font-variation-settings:'wdth' 78}
.ph p{color:var(--mute);margin-top:12px;max-width:46ch}

/* detail */
.dt{padding-top:calc(env(safe-area-inset-top,0px) + 76px);padding-bottom:120px}
.crumb{display:flex;gap:8px;align-items:center;color:var(--mute);font-size:.88rem;padding-block:10px}
.crumb a:hover{color:var(--ink)}
.dt-grid{display:grid;gap:22px}
@media (min-width:980px){.dt-grid{grid-template-columns:1.25fr 1fr;gap:44px;align-items:start}.dt-info{position:sticky;top:84px}}
.gal-m{position:relative;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;border-radius:24px;scrollbar-width:none;background:var(--surface2)}
.gal-m::-webkit-scrollbar{display:none}
.gal-m>*{flex:0 0 100%;scroll-snap-align:center;aspect-ratio:4/3;position:relative;cursor:zoom-in}
.gal-m img,.gal-m video{width:100%;height:100%;object-fit:cover}
.gal-pill{position:absolute;right:14px;bottom:14px;z-index:3;display:flex;gap:8px;align-items:center;padding:9px 14px;border-radius:999px;background:rgba(8,9,12,.72);color:#fff;font-size:.85rem;font-weight:700;backdrop-filter:blur(8px)}
.gal-pill svg{width:16px;height:16px}
.thumbs{display:flex;gap:8px;margin-top:10px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.thumbs button{flex:0 0 76px;aspect-ratio:4/3;border-radius:12px;overflow:hidden;opacity:.6;position:relative;background:var(--surface2);transition:.2s}
.thumbs button.on,.thumbs button:hover{opacity:1;box-shadow:0 0 0 2px var(--accent)}
.thumbs img{width:100%;height:100%;object-fit:cover}
.code{display:inline-flex;gap:8px;padding:5px 12px;border-radius:999px;background:var(--surface2);font-weight:700;font-size:.82rem;letter-spacing:.04em;font-variant-numeric:tabular-nums}
.dt h1{font-size:clamp(2.2rem,8vw,3.8rem);margin:12px 0 6px;letter-spacing:-.035em}

.rate span{color:var(--mute);font-weight:600}

.h3{font-size:1.5rem;margin:34px 0 14px;letter-spacing:-.02em}
.specs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.spec{background:var(--surface);border-radius:14px;padding:12px 14px;min-width:0}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 14px;border-radius:999px;background:var(--surface);font-weight:600;font-size:.9rem}
.prose{color:var(--mute);max-width:62ch;white-space:pre-line;line-height:1.7}
.info-list{display:grid;gap:8px}

details.trip{margin-top:14px;background:var(--surface);border-radius:14px;padding:4px 16px}

async function cloudLoad() {

  const [cars, revs, set] = await Promise.all([q('cars', 'cars?select=*&order=created_at.desc'), q('reviews', 'reviews?select=*&order=created_at.desc'), q('settings', 'site_settings?select=settings&id=eq.main')]);

    const urls = await cSign(paths, tok);

}

/* ---------- saving (live for everyone straight away) ---------- */
async function cEnsureMedia(m) {
  if (m.path || /^https?:/.test(m.src || '')) return;
  if (!m.src) return;
  const blobOf = async u => { const r = await fetch(u); if (!r.ok) throw new Error('Could not read a photo to copy it into Cloud.'); return r.blob(); };
  const full = await blobOf(m.src); const isV = (full.type || '').startsWith('video/');
  m.path = await cUpload(full);
  if (!isV) {
    const tb = m.thumb && m.thumb !== m.src ? await blobOf(m.thumb) : await shrink(full, 720, .78);
    m.thumbPath = await cUpload(tb);
  }
  const urls = await cSign([m.path, m.thumbPath], await cToken());
  m.src = urls.get(m.path); if (m.thumbPath) m.thumb = urls.get(m.thumbPath); else delete m.thumb;
}
function cChip() {
  const el = document.getElementById('cchip'); if (!el) return;
  const bad = CS.state === 'error', busy = CS.busy || (dirty() && !bad);
  if (!bad && !busy) { el.style.display = 'none'; return; }
  el.style.display = '';
  el.innerHTML = bad ? `<div><span>Could not save: ${esc(CS.err)}</span><button class="btn sm" data-act="publish">Try again</button></div>` : `<div><span>Saving to the live site…</span></div>`;
}
async function cSync(force) {

  CS.busy = true; CS.state = 'saving'; cChip();
  try {
    S.cars.forEach(c => { if (!cUuid(c.id)) { const old = c.id; c.id = cNewId(); S.reviews.forEach(r => { if (r.carId === old) r.carId = c.id; }); } });
    S.reviews.forEach(r => { if (!cUuid(r.id)) r.id = cNewId(); });
    const copying = S.cars.some(c => c.media.some(m => !m.path && m.src && !/^https?:/.test(m.src)));
    if (copying) toast('Copying your photos into Cloud. This can take a minute.');
    for (const c of S.cars) for (const m of c.media) await cEnsureMedia(m);
    const startSnap = snap();
    const carRows = S.cars.map(cCarToRow), revRows = S.reviews.map(cRevToRow), setKey = cKey(S.settings);
    const gone = [...CS.base.cars.keys()].filter(id => !carRows.some(r => r.id === id));
    const goneRev = [...CS.base.reviews.keys()].filter(id => !revRows.some(r => r.id === id));
    const chCars = carRows.filter(r => force || CS.base.cars.get(r.id) !== cKey(r));
    const chRevs = revRows.filter(r => force || CS.base.reviews.get(r.id) !== cKey(r));
    const setChanged = force || setKey !== CS.base.settings;
    const now = new Date().toISOString(), up = (t, rows) => cRest(t + '?on_conflict=id', { method: 'POST', body: rows.map(r => Object.assign({ updated_at: now }, r)), prefer: 'resolution=merge-duplicates,return=minimal', auth: true });
    if (goneRev.length) await cRest('reviews?id=in.(' + goneRev.join(',') + ')', { method: 'DELETE', auth: true });
    if (gone.length) await cRest('cars?id=in.(' + gone.join(',') + ')', { method: 'DELETE', auth: true });
    for (let i = 0; i < chCars.length; i += 20) await up('cars', chCars.slice(i, i + 20));
    for (let i = 0; i < chRevs.length; i += 20) await up('reviews', chRevs.slice(i, i + 20));
    if (setChanged) await cRest('site_settings?on_conflict=id', { method: 'POST', body: [{ id: 'main', settings: S.settings, updated_at: now }], prefer: 'resolution=merge-duplicates,return=minimal', auth: true });
    CS.base.cars = new Map(carRows.map(r => [r.id, cKey(r)])); CS.base.reviews = new Map(revRows.map(r => [r.id, cKey(r)])); CS.base.settings = setKey;
    const wasFallback = CS.fallback;

    if (wasFallback && !A.draft && !A.rev) render(true);

  } catch (e) {
    CS.state = 'error'; CS.failedSnap = snap();
    if (e && e.status === 401) { sess.del('big-admin'); cAuth.clear(); CS.err = 'Your session ended. Sign in again.'; render(); }

  if (CS.again) { CS.again = false; if (dirty()) cSync(); }
}

/* ---------- lists ---------- */
const FL = { sale: { q: '', make: '', min: '', max: '', year: '', cond: '', sort: 'new' }, rent: { q: '', make: '', body: '', max: '', chauffeur: '', sort: 'new' } };
function listItems(kind) {
  const f = FL[kind], rent = kind === 'rent';
  let items = S.cars.filter(c => isRent(c) === rent && LIST_OK(c));
  const q = f.q.trim().toLowerCase();
  if (q) items = items.filter(c => [carTitle(c), c.code, c.summary, ...(c.features || [])].join(' ').toLowerCase().includes(q));
  if (f.make) items = items.filter(c => c.make === f.make);
  if (rent) {
    if (f.body) items = items.filter(c => c.body === f.body);
    if (f.chauffeur) items = items.filter(c => c.chauffeur);
    if (+f.max) items = items.filter(c => { const d = (c.rates || []).find(r => r.type === 'daily'); return d && +d.amount <= +f.max; });
  } else {
    if (+f.min) items = items.filter(c => +c.price >= +f.min);
    if (+f.max) items = items.filter(c => +c.price && +c.price <= +f.max);
    if (+f.year) items = items.filter(c => +c.year >= +f.year);
    if (f.cond) items = items.filter(c => c.condition === f.cond);
  }
  const daily = c => +((c.rates || []).find(r => r.type === 'daily')?.amount) || Infinity;
  const P = rent ? daily : c => +c.price || Infinity;
  const sorts = { new: (a, b) => b.created - a.created, plow: (a, b) => P(a) - P(b), phigh: (a, b) => (P(b) === Infinity ? -1 : P(b)) - (P(a) === Infinity ? -1 : P(a)), year: (a, b) => b.year - a.year };
  return items.sort(sorts[f.sort] || sorts.new);
}
function listHTML(kind) {
  const items = listItems(kind);
  if (!items.length) return `<div class="empty"><h3>No matches</h3><p>Nothing fits those filters right now. Clear them or ask us to find it for you.</p><div class="acts" style="justify-content:center"><button class="btn soft" data-act="clear" data-kind="${kind}">Clear filters</button><a class="btn wa" href="${esc(waLink('Hello B.I.G Autos, I am looking for a car that is not listed yet.'))}" target="_blank" rel="noopener">${IC.wa} Ask us</a></div></div>`;
  return `<p class="count num">${items.length} ${items.length === 1 ? 'car' : 'cars'}</p><div class="grid">${items.map(c => card(c)).join('')}</div>`;
}
function listPage(kind) {
  const rent = kind === 'rent', f = FL[kind];
  const pool = S.cars.filter(c => isRent(c) === rent && LIST_OK(c));
  const uniq = k => [...new Set(pool.map(c => c[k]).filter(Boolean))].sort();
  const opt = (arr, v) => arr.map(x => `<option ${x === v ? 'selected' : ''}>${esc(x)}</option>`).join('');
  const years = [...new Set(pool.map(c => c.year).filter(Boolean))].sort((a, b) => b - a);
  const sortOpts = rent ? [['new', 'Newest'], ['plow', 'Daily rate: low to high'], ['phigh', 'Daily rate: high to low']] : [['new', 'Newest'], ['plow', 'Price: low to high'], ['phigh', 'Price: high to low'], ['year', 'Year: newest']];
  const more = rent
    ? `<label>Body style<select class="sel" data-f="rent.body"><option value="">Any</option>${opt(uniq('body'), f.body)}</select></label><label>Max daily rate (₦)<input class="field" inputmode="numeric" data-f="rent.max" value="${esc(f.max)}" placeholder="No limit"></label><label class="ck" style="grid-column:1/-1;display:flex;gap:10px;align-items:center;color:var(--ink);font-size:.95rem"><input type="checkbox" data-f="rent.chauffeur" ${f.chauffeur ? 'checked' : ''} style="width:22px;height:22px;accent-color:var(--accent)"> Chauffeur available</label>`
    : `<label>Min price (₦)<input class="field" inputmode="numeric" data-f="sale.min" value="${esc(f.min)}" placeholder="0"></label><label>Max price (₦)<input class="field" inputmode="numeric" data-f="sale.max" value="${esc(f.max)}" placeholder="No limit"></label><label>Year from<select class="sel" data-f="sale.year"><option value="">Any</option>${years.map(y => `<option ${String(y) === String(f.year) ? 'selected' : ''}>${y}</option>`).join('')}</select></label><label>Condition<select class="sel" data-f="sale.cond"><option value="">Any</option>${opt(uniq('condition'), f.cond)}</select></label>`;
  return `<div class="ph in"><h1>${rent ? 'Exclusive Rentals' : 'Cars for Sale'}</h1><p>${rent ? 'Exclusive rides for the day, the week or the month. Message us to confirm dates and rates.' : 'Every car comes with full details. Message us to book an inspection, anywhere in Nigeria.'}</p></div>
  <div class="in"><div class="fbar"><div class="row"><input class="field grow" type="search" placeholder="Search make, model or code" aria-label="Search" data-f="${kind}.q" value="${esc(f.q)}"><select class="sel" aria-label="Make" data-f="${kind}.make"><option value="">All makes</option>${opt(uniq('make'), f.make)}</select><select class="sel" aria-label="Sort" data-f="${kind}.sort">${sortOpts.map(s => `<option value="${s[0]}" ${f.sort === s[0] ? 'selected' : ''}>${s[1]}</option>`).join('')}</select></div>
  <details><summary class="btn soft sm" style="list-style:none;width:max-content">${IC.sliders} More filters</summary><div class="more" style="margin-top:10px">${more}</div></details></div>
  <div id="list">${listHTML(kind)}</div></div><div style="height:60px"></div>`;
}

function detail(c) {

  ).filter(s => s[1]);

  const mode = c.chauffeur && c.selfDrive ? 'Chauffeur or self-drive' : c.chauffeur ? 'Chauffeur provided' : c.selfDrive ? 'Self-drive' : '';

  ${c.status === 'draft' || c.status === 'archived' ? `<div class="notice"><b>${esc(st)} preview.</b> Only staff can see this page.</div>` : ''}
  <div class="dt-grid"><div><div class="gal-m" id="gal">${slides}</div>${thumbs}
   ${media.length ? `<button class="btn soft sm" style="margin-top:10px" data-act="viewer" data-i="0">${IC.expand} Full-screen gallery (${media.length})</button>` : ''}</div>
  <div class="dt-info"><span class="code">${esc(c.code)}</span> ${c.sample ? '<span class="pill sample">Sample listing</span>' : ''}

   ${rent ? (rates.length ? `<div class="rates">${rates.map(r => `<div class="rate"><span>${RATE_LABEL[r.type]}${r.note ? `<small>${esc(r.note)}</small>` : ''}</span><b>${r.type === 'custom' || !+r.amount ? 'Contact for rates' : NGN(r.amount)}${r.type !== 'custom' && +r.amount ? `<small style="display:inline;font-family:var(--f-body);font-weight:500"> / ${RATE_UNIT[r.type]}</small>` : ''}</b></div>`).join('')}</div>` : `<div class="rates"><div class="rate"><span>Rates</span><b>Contact for rates</b></div></div>`) : ''}
   ${sold ? `<div class="sold-note">This car has been sold. Message us and we will help you find something similar.</div>` : ''}
   ${rent && !sold ? planHTML(c) : ''}
   <div class="acts">${waBtn}<button class="btn soft" data-act="share" data-id="${c.id}">${IC.share} Share</button><button class="btn soft ${isFav(c.id) ? 'on' : ''}" data-act="fav" data-id="${c.id}" aria-pressed="${isFav(c.id)}">${IC.heart.replace('<svg', '<svg width="20" height="20"')} ${isFav(c.id) ? 'Saved' : 'Save'}</button></div>

   ${rinfo.length ? `<h3 class="h3">Rental information</h3><div class="info-list">${rinfo.map(s => `<div><small>${s[0]}</small>${esc(s[1])}</div>`).join('')}</div>` : ''}

}

/* ---------- router / render ---------- */
function viewHTML() {
  const r = route.name;
  if (r === 'home') return home();
  if (r === 'cars') return listPage('sale');
  if (r === 'rentals') return listPage('rent');
  if (r === 'car') return detail(S.cars.find(c => !isRent(c) && c.slug === route.slug));
  if (r === 'rental') return detail(S.cars.find(c => isRent(c) && c.slug === route.slug));
  if (r === 'saved') return savedPage();
  if (r === 'about') return aboutPage();
  if (r === 'contact') return contactPage();
  if (r === 'reviews') return reviewsPage();
  return home();
}
function render(keepScroll) {
  closeViewer(); closeModal();
  Object.assign(route, parseRoute());
  document.documentElement.style.setProperty('--accent-base', cfg().accent || BRAND_RED);
  const root = $('#root'), y = scrollY;
  if (route.name === 'admin') {
    document.documentElement.classList.add('solid');
    root.innerHTML = adminHTML();
    document.title = 'Staff · ' + cfg().name;
  } else {
    const showFab = !['car', 'rental'].includes(route.name);
    root.innerHTML = `<div class="road" aria-hidden="true"><i></i></div>${header()}<main id="view">${viewHTML()}</main>${footer()}${showFab ? `<a class="fab" href="${esc(waLink('Hello B.I.G Autos, I have a question.'))}" target="_blank" rel="noopener" aria-label="Chat on WhatsApp">${IC.wa}</a>` : ''}${isAdmin() && dirty() ? '<div style="position:fixed;left:12px;top:calc(env(safe-area-inset-top,0px) + 66px);z-index:61"><a class="pill sample" href="#admin">Unpublished changes</a></div>' : ''}`;
    document.title = cfg().name;
  }
  if (keepScroll) scrollTo(0, y); else scrollTo(0, 0);
  fx(true);
}

/* ---------- scroll effects ---------- */
let ticking = false, bandHalf = 0;
function onScroll() { if (!ticking) { ticking = true; requestAnimationFrame(() => fx()); } }
function fx(force) {
  ticking = false;
  const y = scrollY, max = document.documentElement.scrollHeight - innerHeight;
  const road = $('.road'); if (road) road.style.setProperty('--prog', max > 0 ? clamp(y / max, 0, 1) : 0);
  document.documentElement.classList.toggle('solid', route.name !== 'home' || y > 60);
  if (reduce) return;
  const hb = $('[data-sy]');
  if (hb && y < innerHeight * 1.5) hb.style.transform = `translate3d(0,${y * (+hb.dataset.sy)}px,0) scale(${1 + Math.min(y, 800) * 0.0002})`;
  const bx = $('[data-bx]');
  if (bx) { if (!bandHalf || force) bandHalf = bx.scrollWidth / 10; bx.style.transform = `translate3d(${-((y * 0.6) % bandHalf)}px,0,0)`; }
  const vw = innerWidth;

function closeViewer() {

}
function vLabels() {
  const n = $('#vw-n'); if (n) n.textContent = (V.i + 1) + ' / ' + V.items.length;

  $$('.vw-slide video').forEach((v, k) => { if (k !== V.i) v.pause(); });
}
function vGo(k) { V.i = clamp(k, 0, V.items.length - 1); vLabels(); }
function vKey(e) { if (e.key === 'Escape') closeViewer(); else if (e.key === 'ArrowRight') vGo(V.i + 1); else if (e.key === 'ArrowLeft') vGo(V.i - 1); }
function vDown(e) {
  if (e.target.closest('video')) return;

}
function vMove(e) {
  const st = $('#vw-stage'); if (!st) return;
  const r = st.getBoundingClientRect();

  V.dx = e.clientX - V.sx; V.dy = e.clientY - V.sy;
  if (!V.axis && Math.hypot(V.dx, V.dy) > 8) V.axis = Math.abs(V.dx) > Math.abs(V.dy) ? 'x' : 'y';
  if (V.axis === 'y') V.close = clamp(V.dy, 0, 400);
}
function vUp() {
  if (!V.drag) return; V.drag = false;
  const W = $('#vw-stage')?.clientWidth || 1;
  if (V.axis === 'x' && Math.abs(V.dx) > Math.min(70, W * .18)) vGo(V.i + (V.dx < 0 ? 1 : -1));
  if (V.axis === 'y' && V.dy > 130) { closeViewer(); return; }
  V.dx = 0; V.dy = 0; V.close = 0; V.axis = '';
}
function vTick() {
  if (!V.on) return;

async function shrink(file, max = 1800, q = .82) {
  if (!/^image\/(jpe?g|png|webp|heic|avif|gif)$/i.test(file.type)) return file;
  try {
    const bmp = await createImageBitmap(file); const s = Math.min(1, max / Math.max(bmp.width, bmp.height));
    const cv = document.createElement('canvas'); cv.width = Math.round(bmp.width * s); cv.height = Math.round(bmp.height * s);
    cv.getContext('2d').drawImage(bmp, 0, 0, cv.width, cv.height);
    const blob = await new Promise(r => cv.toBlob(r, 'image/webp', q));
    return blob && blob.size < file.size ? blob : file;
  } catch { return file; }
}
const toDataURL = b => new Promise((res, rej) => { const f = new FileReader(); f.onload = () => res(f.result); f.onerror = () => rej(f.error); f.readAsDataURL(b); });
async function uploadOne(file, wantThumb) {
  if (MODE === 'cloud') return wantThumb ? cUploadPhoto(file) : cSmallImage(file);
  if (MODE === 'github') {
    const isV = file.type.startsWith('video/');
    if (isV && file.size > 12 * 1024 * 1024) throw new Error('Videos must be under 12 MB. Trim or compress it first.');
    const blob = isV ? file : await shrink(file);
    const out = { url: await toDataURL(blob), type: isV ? 'video' : 'image' };
    if (wantThumb && !isV) out.thumb = await toDataURL(await shrink(file, 720, .78));
    return out;
  }
  if (MODE === 'vercel' || MODE === 'server') {
    const isV = file.type.startsWith('video/');
    if (isV && file.size > (MODE === 'server' ? 12 : 3.2) * 1024 * 1024) throw new Error('Videos must be under ' + (MODE === 'server' ? 12 : 3) + ' MB. Trim or compress it first.');
    const blob = isV ? file : await shrink(file);
    const [r, t] = await Promise.all([apiPost('/api/upload', { dataUrl: await toDataURL(blob) }), wantThumb && !isV ? shrink(file, 720, .78).then(async tb => apiPost('/api/upload', { dataUrl: await toDataURL(tb) })) : null]);
    return { url: r.url, type: isV ? 'video' : 'image', thumb: t ? t.url : undefined };
  }
  const api = await window.claude?.use?.('assets');
  if (!api) throw new Error('Uploads need owner access to this page.');
  const isV = file.type.startsWith('video/');
  if (isV && file.size > 20 * 1024 * 1024) throw new Error('Videos must be under 20 MB.');
  const blob = isV ? file : await shrink(file);
  const r = await api.upload(blob);
  return { url: r.url, type: isV ? 'video' : 'image' };
}

async function ghApi(g, path, method = 'GET', body) {
  const r = await fetch((g.api || 'https://api.github.com') + path, { method, headers: { Authorization: 'Bearer ' + g.token, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json', 'X-GitHub-Api-Version': '2022-11-28' }, body: body ? JSON.stringify(body) : undefined });
  let j = {}; try { j = await r.json(); } catch { /* empty */ }
  if (!r.ok) { const e = new Error(j.message || ('GitHub error ' + r.status)); e.status = r.status; throw e; }
  return j;
}
const ghWhy = (e, g) => e.status === 401 ? 'GitHub did not accept the key. Make a new one and save it under Site, Publishing.'
  : (e.status === 403 || e.status === 404) ? 'The key cannot write to ' + g.repo + '. It needs Contents: Read and write on that repository.'
  : (e.status === 409 || e.status === 422) ? 'GitHub refused the update (' + (e.message || 'conflict') + '). Try again in a moment.'
  : (e.message || 'Could not reach GitHub');
async function publishGithub() {
  if (A.busy) return;
  const g = GH.get();
  if (!g.token || !/^[\w.-]+\/[\w.-]+$/.test(g.repo || '')) { toast('Add your GitHub details first: Site, then Publishing.'); A.tab = 'site'; render(); return; }
  g.branch = g.branch || 'main';
  A.busy = true; render(true);
  try {
    await saveLocal(true);
    const out = JSON.parse(JSON.stringify(S)), files = new Map(), cache = new Map();
    const EXT = { 'image/jpeg': 'jpg', 'image/png': 'png', 'image/webp': 'webp', 'image/gif': 'gif', 'image/avif': 'avif', 'video/mp4': 'mp4', 'video/webm': 'webm' };
    const walk = async o => {
      for (const k of Object.keys(o)) {
        const v = o[k];
        if (typeof v === 'string' && /^data:(image|video)\//.test(v)) {
          if (!cache.has(v)) {
            const m = /^data:([^;]+);base64,(.*)$/s.exec(v); if (!m || !EXT[m[1]]) throw new Error('One file is not a supported photo or video type.');
            const bytes = Uint8Array.from(atob(m[2]), ch => ch.charCodeAt(0));
            const h = [...new Uint8Array(await crypto.subtle.digest('SHA-1', bytes))].map(x => x.toString(16).padStart(2, '0')).join('');
            const path = 'uploads/' + h + '.' + EXT[m[1]];
            files.set('public/' + path, m[2]); cache.set(v, '/' + path);
          }
          o[k] = cache.get(v);
        } else if (v && typeof v === 'object') await walk(v);
      }
    };
    await walk(out);
    out.savedAt = Date.now();
    files.set('public/data/state.json', btoa(unescape(encodeURIComponent(JSON.stringify(out)))));
    const base = '/repos/' + g.repo;
    const list = [...files], blobSha = new Map();
    for (let i = 0; i < list.length; i += 4) {
      await Promise.all(list.slice(i, i + 4).map(async ([path, b64]) => {
        const b = await ghApi(g, base + '/git/blobs', 'POST', { content: b64, encoding: 'base64' });
        blobSha.set(path, b.sha);
      }));
    }
    const tree = [...blobSha].map(([path, sha]) => ({ path, mode: '100644', type: 'blob', sha }));
    /* if someone else (or a code update) lands a commit while we publish, read the newest head and try again */
    for (let tries = 1; ; tries++) {
      try {
        const ref = await ghApi(g, base + '/git/ref/heads/' + encodeURIComponent(g.branch));
        const head = ref.object.sha;
        const commit = await ghApi(g, base + '/git/commits/' + head);
        const nt = await ghApi(g, base + '/git/trees', 'POST', { base_tree: commit.tree.sha, tree });
        const nc = await ghApi(g, base + '/git/commits', 'POST', { message: 'Update site from dashboard', tree: nt.sha, parents: [head] });
        await ghApi(g, base + '/git/refs/heads/' + encodeURIComponent(g.branch), 'PATCH', { sha: nc.sha });
        break;
      } catch (e) {
        if ((e.status === 409 || e.status === 422) && tries < 4) { await new Promise(r => setTimeout(r, 600 * tries)); continue; }
        throw e;
      }
    }
    S = out; savedSnap = snap(); lastLocal = snap(); pubMark();
    try { await IDB.set('state', { at: S.savedAt, state: JSON.parse(JSON.stringify(S)) }); } catch { /* ignore */ }
    A.busy = false; toast('Published. Your site will update in about a minute.'); render(true);
  } catch (e) { A.busy = false; toast('Could not publish: ' + ghWhy(e, g)); render(true); }
}
async function publish() {
  if (MODE === 'cloud') { CS.failedSnap = null; CS.state = 'idle'; return cSync(); }
  if (MODE === 'github') return publishGithub();
  if (MODE === 'vercel' || MODE === 'server') return publishRemote();

  const api = await window.claude?.use?.('artifact');

  A.busy = true; render(true);

}
